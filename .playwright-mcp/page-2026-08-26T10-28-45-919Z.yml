              - textbox "Body text" [ref=f16e116]: "RILT is the stack I've spent the last five years sharpening: Ruby on Rails for rapid backend development, React for interactive UIs, Linux for the deployment and operations layer, and TypeScript for type safety across the whole system. It's pragmatic, battle-tested, and lets me ship reliable software without ceremony."
