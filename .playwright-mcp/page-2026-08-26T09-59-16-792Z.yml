              - textbox "Heading" [ref=f4e353]: About Alex
              - textbox "Body text" [ref=f4e354]: I'm a Portland-based photographer with roots in documentary filmmaking and a lifelong obsession with natural light. My work has appeared in Kinfolk, Cereal, and The Atlantic, and I've exhibited in group shows from Seattle to Tokyo.
              - generic [ref=f4e355]:
                - textbox "Item title" [ref=f4e356]: Approach
                - textbox "Item body" [ref=f4e357]: "I shoot primarily on Fujifilm and Hasselblad systems, favoring available light and minimal gear. The goal is always the same: make images that feel honest, considered, and quietly alive."
              - generic [ref=f4e358]:
                - textbox "Item title" [ref=f4e359]: Background
                - textbox "Item body" [ref=f4e360]: After studying photojournalism at the University of Oregon, I spent four years assisting commercial photographers in New York before going freelance in 2016. Ten years later, I'm still chasing the same feeling that drew me to a camera in the first place.
            - generic [ref=f4e361]:
              - generic [ref=f4e362]: gallery
              - textbox "Heading" [ref=f4e364]: Behind the Lens
              - textbox "Body text" [ref=f4e365]: A glimpse at the places, people, and quiet moments that shape my practice between assignments.
              - generic [ref=f4e366]:
                - textbox "Item title" [ref=f4e367]: On Location
                - textbox "Item body" [ref=f4e368]: Shot during a foggy morning shoot in the Columbia River Gorge — one of my favorite locations within an hour of Portland.
              - generic [ref=f4e369]:
                - textbox "Item title" [ref=f4e370]: Studio Corner
                - textbox "Item body" [ref=f4e371]: My home studio in Northeast Portland, where editing happens and prints are signed before shipping.
