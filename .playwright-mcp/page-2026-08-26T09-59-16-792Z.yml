              - textbox "Body text" [ref=f4e336]: A few words from editors, couples, and brand leads who have trusted me with their stories.
              - generic [ref=f4e337]:
                - textbox "Item title" [ref=f4e338]: Daniel Okafor — Photo Editor, Kinfolk
                - textbox "Item body" [ref=f4e339]: Alex has an uncanny ability to disappear into a scene and come back with images that feel both intimate and intentional. He's our first call for Pacific Northwest features.
              - generic [ref=f4e340]:
                - textbox "Item title" [ref=f4e341]: Mira Linden — Bride, 2024
                - textbox "Item body" [ref=f4e342]: We barely noticed Alex was there, and yet somehow he captured every moment that mattered. The gallery felt like reliving the entire day in vivid detail.
              - generic [ref=f4e343]:
                - textbox "Item title" [ref=f4e344]: Hannah Brooks — Brand Lead, Spruce Coffee
                - textbox "Item body" [ref=f4e345]: The campaign Alex shot for us elevated our entire visual identity. His attention to texture and light made ordinary moments look extraordinary.
