              - textbox "Heading" [ref=f4e304]: What I Offer
              - textbox "Body text" [ref=f4e305]: From single-session portraits to multi-day commercial shoots, every project begins with a conversation about what you want the images to accomplish.
              - generic [ref=f4e306]:
                - textbox "Item title" [ref=f4e307]: Editorial & Commercial
                - textbox "Item body" [ref=f4e308]: Magazine features, brand campaigns, and product photography delivered with a clean, narrative-driven aesthetic. Day rates include pre-production, shooting, and a fully retouched select set.
              - generic [ref=f4e309]:
                - textbox "Item title" [ref=f4e310]: Portraits
                - textbox "Item body" [ref=f4e311]: Studio or on-location portrait sessions for individuals, families, and creative professionals. Sessions run roughly two hours and include a curated online gallery and print release.
              - generic [ref=f4e312]:
                - textbox "Item title" [ref=f4e313]: Weddings & Events
                - textbox "Item body" [ref=f4e314]: Documentary coverage of weddings, engagements, and milestone events. Full-day packages include a second shooter, sneak peeks within 48 hours, and a final gallery of 400+ edited images.
              - generic [ref=f4e315]:
                - textbox "Item title" [ref=f4e316]: Fine Art Prints
                - textbox "Item body" [ref=f4e317]: Limited-edition archival prints from personal projects, available in sizes up to 40×60 inches. Each print is signed, numbered, and shipped with a certificate of authenticity.
            - generic [ref=f4e318]:
              - generic [ref=f4e319]: pricing
              - textbox "Heading" [ref=f4e321]: Starting Rates
              - textbox "Body text" [ref=f4e322]: Every project is scoped individually, but these starting points reflect typical engagements. Custom quotes are always available for unique briefs.
              - generic [ref=f4e323]:
                - textbox "Item title" [ref=f4e324]: Portrait Session
                - textbox "Item body" [ref=f4e325]: Starting at $450 — 2-hour session, one location, online gallery with 30+ edited images and print release.
              - generic [ref=f4e326]:
